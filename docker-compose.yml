# llm-gateway-governance — 全部组件集中在这一个 compose 文件，按阶段往里加服务。
# P1：Ollama（纯 CPU 本地小模型）。P2：LiteLLM 网关 + Postgres。P3：密钥改用 Compose secrets。P4：Presidio 检测 PII。
# 只有 LiteLLM 对宿主机开放 127.0.0.1:4000；Ollama、Postgres、Presidio 只在容器网络内可达。
# 密钥是 .secrets/ 下的文件（由 scripts/gen-secrets.sh 生成，不提交），以 /run/secrets/<名字> 挂进容器，
# 不出现在 environment 里，所以 docker inspect 和 docker compose config 都看不到明文。
name: llm-gateway-governance

services:
  ollama:
    image: ollama/ollama:0.40.8@sha256:2b8eecdb85aa6ea67c381c8ecffec04b2658496cf2821a8f88b0485bdff198e8
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "24h"         # 模型加载后常驻，演示时不冷启动
      OLLAMA_MAX_LOADED_MODELS: "3"    # chat-default、chat-fallback、guard 可同时常驻
      OLLAMA_NUM_PARALLEL: "1"         # CPU 推理，一次只处理一个请求，其余排队
      OLLAMA_CONTEXT_LENGTH: "4096"    # 显式写出，避免版本升级改变默认值
      OLLAMA_NO_CLOUD: "1"             # 关闭 Ollama Cloud：本地模型层不得把请求转发到云端
    volumes:
      - ollama-models:/root/.ollama    # 命名卷，随 WSL 快照导出
    # P2 起不映射任何端口：模型只能经网关访问（总纲决策 8）
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    # 由 scripts/pin-image.sh postgres 写入“版本号@摘要”；UNPINNED 是故意写的无效标签
    image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_DB: litellm
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password   # 官方镜像支持 _FILE；数据卷已初始化，只在全新初始化时用到
    secrets: [postgres_password]
    volumes:
      - pg-data:/var/lib/postgresql/data   # key、团队、费用日志；P4 的 governance schema 也在这里
    # 不映射端口：数据库只给 LiteLLM 用
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  presidio-analyzer:
    # 官方镜像，由 scripts/pin-image.sh presidio 写入“版本号@摘要”；UNPINNED 是故意写的无效标签
    image: mcr.microsoft.com/presidio-analyzer:UNPINNED
    restart: unless-stopped
    environment:
      RECOGNIZER_REGISTRY_CONF_FILE: /app/custom/recognizers.yaml   # 换成本仓库的识别器清单（含加拿大识别器），不自建镜像
      LOG_LEVEL: WARNING                   # 不打 INFO 日志；Presidio 本身不记录请求文本
      WORKERS: "1"
    volumes:
      - ./presidio:/app/custom:ro
    # 不映射端口：只有 LiteLLM 的治理插件调用它。LiteLLM 也不 depends_on 它：Presidio 没起来时网关照常运行，
    # 插件按“检测器不可用”处理（fail-closed），这正是 P4e 要演示的
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s                   # 首次启动要加载 spaCy 的 en_core_web_lg
    logging: *logging

  litellm:
    # 由 scripts/pin-image.sh litellm 写入“版本号@摘要”；只用官方镜像（总纲决策 2）
    image: ghcr.io/berriai/litellm:v1.106.2@sha256:7294b90f868c5c38c99b83021c7ba46f9b439e95f8e32964c925c7d2563a03f7
    restart: unless-stopped
    # 包装入口：从 /run/secrets 读出密钥，作为进程环境变量交给 LiteLLM，再 exec 镜像原入口
    entrypoint: ["/bin/sh", "/app/config/entrypoint.sh"]
    command: ["--config", "/app/config/config.yaml", "--port", "4000"]
    environment:
      STORE_MODEL_IN_DB: "False"           # 与 config.yaml 一致：模型只来自配置文件
      LITELLM_LOCAL_MODEL_COST_MAP: "True" # 用镜像自带的价格表，启动时不联网下载（P5 离线演示）
      PRESIDIO_URL: http://presidio-analyzer:3000          # P4 治理插件调用的 PII 检测服务
      GOVERNANCE_POLICY: /app/governance/policy.toml       # P4 驻留策略（合规部门审批）
    secrets: [litellm_master_key, litellm_salt_key, postgres_password, anthropic_api_key]
    volumes:
      - ./litellm:/app/config:ro           # config.yaml、治理插件、入口脚本，只读挂载
      - ./governance:/app/governance:ro    # policy.toml 等；挂整个目录而不是单个文件，git 切换版本后容器也能看到新文件
    ports:
      - "127.0.0.1:4000:4000"              # 唯一对外端口：API 与管理界面
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s                   # 首次启动要做数据库迁移
    logging: *logging

volumes:
  ollama-models:
  pg-data:

secrets:
  # 每个文件只含一个值，权限 600。LITELLM_SALT_KEY 永不更改；anthropic_api_key 可为空（chat-cloud 不可用）
  litellm_master_key:
    file: ./.secrets/litellm_master_key
  litellm_salt_key:
    file: ./.secrets/litellm_salt_key
  postgres_password:
    file: ./.secrets/postgres_password
  anthropic_api_key:
    file: ./.secrets/anthropic_api_key
