# LiteLLM 网关配置（配置即代码：改模型、路由、降级只改这里并提交 git）。
# 应用只认逻辑名；后端换模型或加供应商时，应用代码不变。
model_list:
  - model_name: chat-default
    litellm_params:
      model: openai/qwen3:0.6b            # 经 Ollama 的 OpenAI 兼容接口 /v1 调用（P1 实测的路径）
      api_base: http://ollama:11434/v1    # 容器网络内的服务名；Ollama 不对宿主机开放端口
      api_key: ollama                     # Ollama 不校验，占位
      reasoning_effort: none              # 网关统一关闭 qwen3 思考（P1：4.8s → 0.2s）
      timeout: 120
    model_info:
      jurisdiction: local                 # P4 驻留路由用的供应商属性，P2 只是标注
  - model_name: chat-fallback
    litellm_params:
      model: openai/llama3.2:1b
      api_base: http://ollama:11434/v1
      api_key: ollama
      timeout: 120
    model_info:
      jurisdiction: local
  - model_name: chat-github
    litellm_params:
      model: openai/openai/gpt-4.1-mini   # GitHub Models 的模型 ID 是 publisher/model
      api_base: https://models.github.ai/inference
      api_key: os.environ/GITHUB_MODELS_TOKEN
      timeout: 60
      rpm: 15                             # 与 Copilot Pro 低档模型的每分钟限额一致
    model_info:
      jurisdiction: US

router_settings:
  # 只在本地模型之间降级；绝不从本地降级到云端，否则会成为绕过驻留策略的出口
  fallbacks:
    - chat-default: [chat-fallback]
  num_retries: 0                          # 演示时一次失败就降级，日志清楚

litellm_settings:
  callbacks: governance.proxy_handler_instance
  turn_off_message_logging: true          # 日志与回调中不出现请求和响应原文
  request_timeout: 120
  drop_params: false                      # 不认识的参数直接报错，不静默丢弃

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false                # 管理界面不能增改模型，模型只来自本文件
  store_prompts_in_spend_logs: false      # 费用日志不存原文（默认即 false，这里显式写出）
  # 允许请求里带 mock_testing_fallbacks 等测试参数，用于 P2 降级测试和 P5 演示“故障降级”。
  # 只影响带参数的那个请求本身。生产环境应设为 false（见 ADR）。
  dangerously_allow_mock_testing_request_params: true
